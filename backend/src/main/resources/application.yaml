spring:
  application:
    name: running-course
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/running_course}
    username: ${DATABASE_USERNAME:running_course}
    password: ${DATABASE_PASSWORD:local_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
geocoding:
  nominatim:
    reverse-url: ${NOMINATIM_REVERSE_URL:https://nominatim.openstreetmap.org/reverse}
    user-agent: ${NOMINATIM_USER_AGENT:RunningCourse/0.1.0 (https://github.com/chaengs/running-course)}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
